[package]
name = "bullet"
version = "0.1.0"
description = "Bullet — Ansem-backed up-only token on Solana (mint/burn/loans/leverage)"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "bullet"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { version = "0.31.1", features = ["init-if-needed"] }
anchor-spl = { version = "0.31.1", features = ["token_2022"] }
spl-token-2022 = "6.0.0"
# Keep TRANSFER_HOOK_PROGRAM_ID in lockstep with bullet-transfer-hook's declare_id!
# (so `anchor keys sync` for localnet updates both programs together).
bullet-transfer-hook = { path = "../bullet-transfer-hook", features = ["no-entrypoint"] }
